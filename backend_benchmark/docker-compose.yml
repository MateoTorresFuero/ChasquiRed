services:
  bench-go:
    build: ./go
    container_name: bench-go
    environment:
      - PORT=${GO_PORT:-8081}
    ports: ["${GO_PORT:-8081}:${GO_PORT:-8081}"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped   

  bench-node:
    build: ./node
    container_name: bench-node
    environment:
      - PORT=${NODE_PORT:-8082}
    ports: ["${NODE_PORT:-8082}:${NODE_PORT:-8082}"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  bench-python:
    build: ./python
    container_name: bench-python
    environment:
      - PORT=${PYTHON_PORT:-8083}
    ports: ["${PYTHON_PORT:-8083}:${PYTHON_PORT:-8083}"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  bench-java:
    build: ./java
    container_name: bench-java
    environment:
      - PORT=${JAVA_PORT:-8084}
    ports: ["${JAVA_PORT:-8084}:${JAVA_PORT:-8084}"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
